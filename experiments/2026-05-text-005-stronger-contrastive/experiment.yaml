reflection:
  hypothesis_outcome: refuted
  surprises: |
    The projector's response to contrastive weight is non-monotonic. At weight 0.3, OOD inputs (random, zero) get more decorrelated K/V (good), but in-distribution refs (swap, code — same register, different author/domain) get MORE similar K/V than at weight 0.1. This is exactly the wrong shape for style transfer between same-register authors. The α-blend LLM-judge signal flipped from monotonic +0.25 to non-monotonic -0.25.
  corrections_to_prior_beliefs: |
    Bumping contrastive weight is NOT a knob that monotonically improves style conditioning. The relationship is non-monotonic — both 0.1 and 0.3 are sub-optimal for different reasons. Loss-only intervention has been explored on both sides at this architecture; further hyperparameter search at this projector design is unlikely to be informative. The shared MLP trunk in PrefixProjector is forcing all per-layer K/V through one low-dim subspace, which is what gets non-uniformly squashed by contrastive pressure.
  next_experiment: 2026-05-text-006-projector-no-trunk
  rolls_up_to_project: true
  rolls_up_to_program: true
