headline: "Hypothesis REFUTED. T3b regressed 55%->50%, LLM-judge alpha-blend signal inverted +0.25->-0.25, pathway cos_K for same-domain refs got WORSE (swap 0.31->0.69, code 0.33->0.69). T2 actually improved 60%->65%. Projector responds non-monotonically to contrastive weight; more pressure is not the answer. Next: 006 architectural fix (no-trunk projector)."
implementation_notes: |
  Only change vs 004: text-ip-adapter/configs/stage1_gemma_contrastive_03.yaml
  with contrastive_weight: 0.3 instead of 0.1. Everything else identical.

  Eval pipeline (same as 004 standard post-training):
  1. eval_from_checkpoint.py -> samples_n20.jsonl (T1, T2, T3, T3b, T4, T5)
