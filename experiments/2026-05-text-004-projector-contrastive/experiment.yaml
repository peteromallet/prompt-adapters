  capability_test_strength_dial: "PARTIAL / SATURATION (λ=0 differs from λ=1 by Jaccard=0.000; λ=0.5 vs λ=1 = 0.155; λ=2 vs λ=1 = 0.243 — λ=2 is MORE similar to λ=1 than λ=0.5 is, indicating saturation around λ=1, not a smooth continuous dial. Output remains coherent at all λ — length(λ=2)/length(λ=1) = 1.01.)"
headline: "Contrastive loss on projector K/V broke the projector collapse decisively (cos_K/V 0.91 -> 0.41 average). All must-pass criteria met but T2/T3b are at the edge. Capability tests: α-blend shows monotonic interpolation in 6/8 probes (directional C3 evidence); strength-dial saturates at λ=1 rather than scaling smoothly. Net: C1 first non-register-bias evidence; C3 directional positive; C4 partial."
next: "Two parallel branches based on capability tests. (a) Bump contrastive_weight 0.1 -> 0.3 OR run experiment 005 (no-trunk projector) — these target the marginal T3b gap. (b) Run a stronger α-blend probe with LLM-judge style-axis verification, since textual Jaccard monotonicity doesn't guarantee STYLE-axis interpolation. Then capability-test the result. The audio-port (experiment 008+, separate project) is unlocked once one of (a) is decisive."

reflection:
  hypothesis_outcome: partially_confirmed
  surprises: |
    1. The contrastive loss did exactly what the diagnostic predicted: cos_K/V collapsed from 0.91 to 0.41 average. Larger swing than expected (-0.50 vs predicted -0.30 to -0.50). Validates the 003 diagnosis precisely.
    2. cos_z (encoder output diversity) ALSO improved from 0.77 to 0.40 for swap variants — gradient flow back through the projector improved the encoder too, without any direct pressure on z. Free side-effect.
    3. T3b moved less than the projector unblock would suggest. cos_K/V dropped 50 percentage points but T3b only moved 10pp. That gap is the key open question.
    4. α-blend showed monotonic interpolation in 6 of 8 probes — STRONGER than I predicted (predicted 3-5/8). The latent space appears more continuous than I feared.
    5. Strength-dial saturated. λ=2 outputs are more like λ=1 than λ=0.5 outputs are. The model has a "loud enough" threshold, not a smooth intensity dial. Unexpected and means C4 needs different framing.
  corrections_to_prior_beliefs: |
    1. C1 has its first non-register-bias evidence. 002's T2 PASS was the wrong reason; 004's T2 PASS is the right reason but smaller magnitude. Move C1 from "testing" to "supported with caveats — directional, not decisive."
    2. The "T2 PASS is necessary but not sufficient" framing was correct AND actionable: 003's pathway probe + 004's contrastive intervention together produced the right diagnosis-to-fix loop. Pathway probes belong in the standard eval, not as optional follow-ups.
    3. Contrastive loss on K/V outputs is the right kind of intervention. We had three candidate diagnoses (data, encoder, projector) and picked the right one. The ROI on diagnostic experiments is high.
    4. Strength-dial saturation suggests the prefix has a "regime" effect, not a smooth ramp. C4's framing should change from "linear strength dial" to "thresholded conditioning depth" — different (but still useful) capability.
    5. α-blend monotonic at 6/8 is genuine partial evidence for C3, but the metric is text-Jaccard, not style-axis-aware. Need an LLM-judge α-blend probe ("does α=0.5 look stylistically intermediate?") before C3 can be supported decisively.
  next_experiment: "Either 2026-05-text-005-projector-no-trunk (architectural fix to push T3b past 60% decisively) OR 2026-05-text-005-stronger-contrastive (bump weight to 0.3 — same architecture, more pressure). Run capability-test follow-up on whichever yields T3b PASS. Audio-001 unlocked after that."
  rolls_up_to_project: true
  rolls_up_to_program: true
implementation_notes: |
  Training loop change (src/text_ip_adapter/train/loop.py):
  1. For each batch, compute projector K/V for each sample.
  2. For each injected layer: flatten (P, num_kv_heads, head_dim) -> single vector per sample.
  3. Compute all-pairs cosine matrix (B x B) across different-author samples in batch.
  4. Contrastive term: push off-diagonal cosines toward 0 (or below). Simplest form:
       L_contrastive_layer = mean_off_diagonal(cos_matrix).clamp(min=0)
     Aggregate across layers, add with weight lambda.
  5. Total loss = L_ntk + lambda * L_contrastive. Start lambda=0.1; if no K/V gap
     opens by step 500, bump to 0.5.
  6. Log L_ntk and L_contrastive separately to wandb / train_log.jsonl.
  Evaluation: re-run eval_probes.py with --n-judge 20 AND scripts/probe_conditioning.py on
  the final checkpoint. Compare cos_K/V across refs vs 003's baseline — this is the primary
  result, not T2 or T3b.
