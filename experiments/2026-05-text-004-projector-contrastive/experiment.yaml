type: training
question: "Does adding a contrastive loss on per-layer projector K/V outputs break the projector's near-constant collapse identified in experiment 003?"
hypothesis: |
  Adding an InfoNCE-style contrastive term that pushes in-batch different-author projector
  K/V outputs apart — combined with the existing next-token CE — will force the projector
  to produce reference-specific K/V. Predict: after 2000 steps at contrastive weight ~0.1,
  cos_K/V across pathological references drops from 002's 0.77-0.98 range into the 0.3-0.6
  range. LLM-judge T3b moves from coin-flip (45-50%) to at least 55-60% adapter-wins.
  T2 stays PASS (above 60%).
parent: 2026-04-text-003-conditioning-probe
base_model: "google/gemma-3-4b-pt (frozen) — same as 001/002"
dataset: "same 971 pairs as 002, LLM-generated instructions at data/pairs/*.llm.jsonl. NO data change."
core_commit: "text-ip-adapter SHA b523e0beb96827000bc05d131d5fdcb5a226f226 (contrastive loss in train/loop.py)"
compute: "RTX 4090, ~37 min training + ~10 min eval (n=20 + pathway probe) + capability probe. Total ~$0.85."
