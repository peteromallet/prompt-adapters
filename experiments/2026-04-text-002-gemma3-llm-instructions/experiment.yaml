id: 2026-04-text-002-gemma3-llm-instructions
modality: text
project: text-gemma3-prefix-kv
tags:
  - frozen-base
  - prefix-kv-injection
  - perceiver-encoder
  - llm-generated-instructions
  - 4-register-data
  - author-paired
