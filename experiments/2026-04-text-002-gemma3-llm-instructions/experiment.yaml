status: closed
consequential: true
question: "Does replacing rule-based instructions with Claude-generated content-only instructions push T3 style-carryover from FAIL → PASS, without degrading T1/T2?"
hypothesis: "Cleaner content-only instructions free the prefix channel to carry style signal instead of compensating for noisy instructions. Expectation: T3 at least WEAK, T2 stable or improved over 001's TIE."
parent: 2026-04-text-001-gemma3-adapter
base_model: "google/gemma-3-4b-pt"
dataset: "971 pairs (same as 001) with instructions regenerated via claude-haiku-4-5 from target only; output at data/pairs/{train,val,test}.llm.jsonl. Regen cost: ~$0.13."
core_commit: "RETROSPECTIVE-000000"
compute: "RTX 4090, ~37 min training + ~2 min regen, ~$0.55 total"
results:
  test1_discrimination: "PASS (jaccard 0.201, n=20)"
  test2_vs_prompting: "PASS (70% win rate, 14W/6L/0T, n=20)"
  test3_style_carryover: "FAIL (13/20 own-wins, mean adv ≈ 0)"
  test4_memorization: "PASS"
  test4_ref_leak: "PASS"
  test5_loss_curve: "SLOW (15.6%)"
headline: "LLM-generated instructions made T2 decisively PASS at n=20 (70%, 14W/6L/0T) after 001's FAIL, but T3 regressed from WEAK to FAIL under the n=20 instrument."
next: "Experiment 003 (2026-04-text-003-conditioning-probe) ran as a diagnostic follow-up and localized the failure to the projector. Experiment 004 (2026-05-text-004-projector-contrastive) is the next training experiment in the line."
reflection:
  hypothesis_outcome: partially_confirmed
  surprises: |
    T3 style carryover stayed FAIL at n=20 despite T2 passing. The surface-feature metric cannot distinguish style match from noise; T3 is a broken instrument right now, not a real result. Also: delta between 001 and 002 was huge (40pp T2 swing) - larger than expected.
  corrections_to_prior_beliefs: |
    C1 (adapter beats prompting) has first decisive evidence: 70 percent at n=20. T3 needs a better instrument (LLM-judge style-match) before it can guide future decisions. Architectural interventions (003 contrastive loss, encoder widening) are less urgent than fixing eval.
  next_experiment: 2026-04-text-003-conditioning-probe
  rolls_up_to_project: true
  rolls_up_to_program: true
