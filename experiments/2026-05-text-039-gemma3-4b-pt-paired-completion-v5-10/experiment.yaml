conclusion: >
  Paired completion is a better fit for the pretrained base model and
  produces the cleanest evidence so far that the hidden adapter can add
  style signal beyond the visible reference. The effect peaks around
  step 1200 and then overtrains/regresses sharply by 1600/final.

next_best_bet: >
  Repeat the paired-completion Gemma3-4B-pt run with an explicit early
  stopping target around 1000-1300 steps, lower LR or stronger regularization,
  and restore real negatives if memory permits via gradient accumulation or
  shorter prompt/reference lengths. Treat step 1200 as the current best
  checkpoint for qualitative comparison.
