question: >
  For a pretrained completion model, does a paired-completion scaffold
  let the visible prompt and hidden style adapter work together more
  cleanly than the earlier instruction-style prompt?

model:
  base_model_id: google/gemma-3-4b-pt
  checkpoint_source: cold_start

data:
  dataset: text-ip-adapter/data/pairs_v5_10_poetry_llm_style_medium_strong
  train_rows: 2868
  prompt_format: paired_completion
  prompt_reference_max: 320
  target_max: 512
  scaffold: |
    A piece of writing:

    {reference}

    Another piece by the same writer:

training:
  config: text-ip-adapter/configs/stage1_gemma3_4b_pt_poetry_v5_10_paired_completion_2000.yaml
  max_steps: 2000
  batch_size: 1
  projector_lr: 1.0e-5
  encoder_lr: 5.0e-6
  warmup_steps: 100
  min_lr_ratio: 0.10
  contrastive_weight: 0.2
  style_triplet_weight: 1.5
  note: >
    Batch size 1 means the generic batch contrastive loss is effectively
    inactive; style triplet remains active.

