status: finalized
consequential: true
type: diagnostic
question: "Is the reference-conditioning pathway (encoder → projector → injection → output) actually carrying reference-specific signal end-to-end? If not, at which layer does the signal die?"
hypothesis: "Given experiment 002's T2 PASS but T3b FAIL, the adapter likely produces reference-INDEPENDENT outputs despite beating prompting. Predict: either (a) encoder latents collapse to near-identical for any reference, or (b) encoder produces diverse latents but projector/injection doesn't propagate them to output."
parent: 2026-04-text-002-gemma3-llm-instructions
base_model: "google/gemma-3-4b-pt (frozen) + experiment 002's trained adapter checkpoint"
dataset: "10 diagnostic probes from experiments/2026-04-text-002-gemma3-llm-instructions val split. Reference variants: own, swap, zero-prefix, random-tokens, out-of-domain (Python code). No training data used."
core_commit: "text-ip-adapter: f3dc1980280aa16a75f38ce0a114a6a61fb3ac44"
compute: "RTX 4090, ~10 min inference, ~$0.12"
