  injection_working: true
headline: "Diagnostic localizes the conditioning failure: encoder produces reference-varying latents (cos_z 0.0–0.77) but the projector collapses them into near-identical K/V tensors (cos 0.77–0.98), so downstream generation has ~no reference-specific signal to work with. The injection path and base model are fine."
next: "Revise experiment 003 from 'contrastive loss on encoder outputs' to 'projector bottleneck fix'. Two sub-options (003a: contrastive loss on per-layer K/V outputs; 003b: architectural — remove shared MLP trunk in projector)."
reflection:
  hypothesis_outcome: confirmed
  surprises: |
    The projector collapse is more severe than expected. Zero-prefix z (all zeros) produces K/V that is 91% cosine-similar to own-reference K/V — the projector is near-constant across vastly different inputs. Also surprising: the base model is very sensitive to the tiny K/V differences that DO remain (zero-prefix generation is wildly different from own despite 91% K/V similarity on layer 1), meaning the downstream stack is fine and the pathway problem is isolated to the projector.
  corrections_to_prior_beliefs: |
    (1) Experiment 002's T2 PASS (80% win rate vs prompting) is real but NOT evidence of reference conditioning — it's register bias. C1 should be downgraded from "first positive evidence" back toward "testing" because the operational definition requires reference-driven style change, not just quality-over-prompting.
    (2) Contrastive loss on encoder outputs (originally planned for 003) would be misdirected — the encoder already produces diverse latents. The fix needs to live at the projector.
    (3) "Beat prompting on T2" is decisively NOT sufficient evidence of the architecture working as intended. The capability tests (α-blend, strength-dial) are even more load-bearing than I had marked — they would have caught this failure much earlier.
  next_experiment: 2026-05-text-003-projector-contrastive
  rolls_up_to_project: true
  rolls_up_to_program: true
process_deviations: |
  This experiment was run outside the PROCESS.md workflow: tools/launch-experiment.sh was NOT invoked, launch_manifest.json was backfilled retroactively, and the text-ip-adapter repo was not under version control at run time. The probe_conditioning.py script was committed to text-ip-adapter after the run (SHA f3dc198 represents the state at commit time, which matches the script that ran). Acknowledged as a process failure; the backfilled manifest is marked with backfilled=true for auditability. First instance of using the lifecycle scripts on a real experiment — discovered that finalize-experiment.sh assumes training outputs and needs a small tweak for diagnostic-type experiments.
