question: "After curating the v2 corpus and restoring active contrastive loss, can the 006 no-trunk warm-start recipe recover reference-specific K/V discrimination and Opus-judged style match?"
hypothesis: |
  The v2 dryrun failed because cold-start training on noisy v2_clean collapsed to a
  near-constant prefix (cos_K_first_swap=0.989), and the big-context warmstart run
  was confounded because it used batch_size=1 with contrastive disabled. If we
  remove obvious v2 corpus poison (short/whitespace targets, OCR noise,
  non-literary essay scaffolding, suspect mr_* UN-debate speeches, and possibly
  broken screenplay rows), then warm-start from 006 with target_max=1024,
  batch_size=2, and contrastive_weight=0.1 should recover pathway discrimination
  while preserving the larger-context benefit.

  Predict:
  (1) cos_K_first_swap <= 0.40 by final eval.
  (2) Opus T3b adapter wins >= 12/20.
  (3) Opus-flagged mode collapse < 10% on the 50-sample alpha-blend pool.
  (4) Opus T2 adapter-vs-prompted_baseline >= 60%.
