name: prompt-adapters
thesis: "Reference conditioning via dense latent channels can beat prompting on style/behavior transfer, and the architectural pattern generalizes across modalities (text, audio, music, video)."

claims:
  - id: C1
    statement: "Prefix-K/V adapters on a frozen base LM beat the prompted_baseline for style transfer, at reasonable data scales."
    status: testing                       # untested | testing | supported | refuted | abandoned
    primary_project: text-gemma3-prefix-kv
    evidence_so_far: "001 T2 FAIL (30% win rate, n=20). 002 T2 PASS (70-80% win rate, n=20) BUT conditioning-pathway probe in 003 showed T2 PASS was register bias, not reference conditioning. LLM-judge T3b: coin flip (~50% adapter wins) on BOTH experiments. 003 pinpointed the projector as the bottleneck (encoder outputs cos_z 0.0-0.77 across pathological refs, but projector K/V stays cos 0.77-0.98 — near-constant function). C1 needs 004 (contrastive loss on projector K/V) or 005 (architectural — remove shared trunk) before it can be supported. T2 PASS alone is insufficient — must be paired with T3b PASS and a positive pathway probe."

  - id: C2
    statement: "The architectural pattern (reference encoder → projector → prefix injection into frozen base) transfers across modalities."
    status: untested
    primary_project: null
    gates_on: C1
    evidence_so_far: "Requires a second-modality port once C1 is supported."

  - id: C3
    statement: "Composability (α-blending two reference latents) produces smooth interpolations in generated style — a capability prompting cannot replicate."
    status: untested
    primary_project: text-gemma3-prefix-kv
    gates_on: C1
    evidence_so_far: "Probe not yet implemented. Planned after C1 is supported."

  - id: C4
    statement: "A reference channel's win over prompting grows with generation length (context-efficiency advantage)."
    status: untested
    gates_on: C1

active_projects:
  - id: text-gemma3-prefix-kv
    modality: text
    status: active
    current_experiment: 2026-05-text-004-projector-contrastive
    claim_primary: C1
    diagnostic_finding: "003 localized the conditioning failure to the projector (shared MLP trunk collapses encoder diversity). Next: contrastive loss on K/V outputs (004) or architectural fix (005)."

planned_projects:
  - id: audio-musicgen-prefix-kv
    modality: audio
    status: planned
    gates_on: C1
    note: "Port the text pattern to MusicGen. Tests C2."
  - id: music-musicgen-prefix-kv
    modality: music
    status: planned
    gates_on: C1
  - id: video-tbd-prefix-kv
    modality: video
    status: planned
    gates_on: C1
    note: "Base model TBD — Mochi, Wan, or similar."

principles:
  - "Cheapest intervention first: fix test-rig noise before adding architecture."
  - "Capability tests before scaling: α-blending and strength-dial are what prompting literally cannot do."
  - "Author-paired matched-style data is the bedrock; without it, style is unlearnable from next-token CE."
  - "Every experiment must answer a specific pre-registered question."
  - "Experiments are immutable once written up; core code evolves via SHA pinning."
  - "Claude LLM-judge is cheap enough ($0.001/judgment) to use from day one."
