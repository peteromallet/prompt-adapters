name: prompt-adapters
thesis: "Reference conditioning via dense latent channels can beat prompting on style/behavior transfer, and the architectural pattern generalizes across modalities (text, audio, music, video)."

claims:
  - id: C1
    statement: "Prefix-K/V adapters on a frozen base LM beat the prompted_baseline for style transfer, at reasonable data scales."
    status: testing                       # untested | testing | supported | refuted | abandoned
    primary_project: text-gemma3-prefix-kv
    evidence_so_far: "001 T2 FAIL (30%). 002 T2 PASS (70%) was register bias per 003's diagnostic (projector collapse). 004 added contrastive loss on projector K/V at weight 0.1 — projector unblock decisive (cos_K/V 0.91→0.41), T2 PASS 60%, T3b WEAK 55% — first non-register-bias C1 evidence but modest. 005 tested weight 0.3 hypothesis ('more pressure'); REFUTED — T3b regressed to 50%, α-blend LLM-judge signal inverted (+0.25→−0.25), same-domain cos_K got worse (swap 0.31→0.69). Loss-only lever explored on both sides; non-monotonic response. Next: 006 architectural fix (no-trunk projector) — the shared MLP trunk is the root structural cause."

  - id: C2
    statement: "The architectural pattern (reference encoder → projector → prefix injection into frozen base) transfers across modalities."
    status: untested
    primary_project: null
    gates_on: C1
    evidence_so_far: "Requires a second-modality port once C1 is supported."

  - id: C3
    statement: "Composability (α-blending two reference latents) produces smooth interpolations in generated style — a capability prompting cannot replicate."
    status: testing
    primary_project: text-gemma3-prefix-kv
    gates_on: C1
    evidence_so_far: "Experiment 004 capability probe: 6/8 probes show monotonic Jaccard interpolation across α∈{0,0.25,0.5,0.75,1.0}. LLM-judge follow-up (claude-haiku-4-5, 40 judgments) confirms a STYLE-axis signal but weak: frac_picked_as_own_ref grows monotonically from 0.50 (α=0) to 0.75 (α=1.0), signal strength 0.25. Endpoints behave imperfectly — even at α=0 (pure swap_z) only 50% of generations are perceived as more swap-like than own-like, suggesting the adapter projects onto a generic 'literary register' rather than fully committing to either reference's style. C3 has DIRECTIONAL evidence; not decisive."
    note: "Decisive C3 would require frac_own ≈ 0 at α=0, ≈ 0.5 at α=0.5, ≈ 1.0 at α=1.0. Current: 0.50/0.62/0.75. The signal exists but is muted by the same projector-weakness that makes T3b WEAK in 004. Likely needs the 005 follow-up (stronger contrastive or no-trunk) to push C3 to supported."

  - id: C4
    statement: "A reference channel's win over prompting grows with generation length (context-efficiency advantage)."
    status: untested
    gates_on: C1
    note: "C4 was originally framed alongside a 'smooth strength-dial' capability. Experiment 004 capability probe found the prefix saturates around λ=1 rather than scaling smoothly: λ=2 outputs are MORE similar to λ=1 outputs than λ=0.5 outputs are. C4 should be reframed from 'continuous knob' to 'thresholded conditioning depth'. Long-context advantage hasn't been tested yet — that's the proper C4 question."

active_projects:
  - id: text-gemma3-prefix-kv
    modality: text
    status: active
    current_experiment: 2026-05-text-006-projector-no-trunk
    claim_primary: C1
    diagnostic_finding: "003 localized failure to projector. 004 (contrastive weight 0.1) achieved cos_K/V 0.91→0.41 and first non-register-bias C1 evidence with WEAK T3b 55%. 005 (contrastive weight 0.3, same architecture) REFUTED 'more pressure is better' — T3b regressed to 50%, α-blend LLM-judge signal inverted (+0.25→−0.25), same-domain cos_K got WORSE (swap 0.31→0.69). The projector's response to contrastive weight is non-monotonic. Loss-only intervention exhausted at this architecture. Next: 006 architectural fix (no-trunk projector — remove shared MLP trunk, per-layer heads project z directly to K/V)."

planned_projects:
  - id: audio-musicgen-prefix-kv
    modality: audio
    status: planned
    gates_on: C1
    note: "Port the text pattern to MusicGen. Tests C2."
  - id: music-musicgen-prefix-kv
    modality: music
    status: planned
    gates_on: C1
  - id: video-tbd-prefix-kv
    modality: video
    status: planned
    gates_on: C1
    note: "Base model TBD — Mochi, Wan, or similar."

principles:
  - "Cheapest intervention first: fix test-rig noise before adding architecture."
  - "Capability tests before scaling: α-blending and strength-dial are what prompting literally cannot do."
  - "Author-paired matched-style data is the bedrock; without it, style is unlearnable from next-token CE."
  - "Every experiment must answer a specific pre-registered question."
  - "Experiments are immutable once written up; core code evolves via SHA pinning."
  - "Claude LLM-judge is cheap enough ($0.001/judgment) to use from day one."
